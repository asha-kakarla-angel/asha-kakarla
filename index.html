<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Buddy ❤️</title>
<style>
body {
background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
text-align: center;
color: #fff;
margin: 0;
padding: 50px 20px;
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}
.card {
background: rgba(255, 255, 255, 0.2);
backdrop-filter: blur(10px);
padding: 40px;
border-radius: 20px;
box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
max-width: 600px;
width: 100%;
}
h1 {
font-size: 2.5em;
margin-bottom: 10px;
color: #fff;
text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}
p {
font-size: 1.2em;
line-height: 1.6;
margin-bottom: 20px;
}
.heart {
font-size: 3em;
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.2); }
100% { transform: scale(1); }
}
</style>
</head>
<body>

<div class="card">
<div class="heart">❤️</div>
<!-- Change the name below -->
<h1>For [Asha Kakarla], My Everything</h1>
<!-- Change your message below -->
<p>You make every single day brighter, happier, and full of love. I built this little corner of the internet just to remind you how special you are to me.</p>
<p>Forever yours,<br><strong>[Your Name]</strong></p>
</div>

</body>
</html>
